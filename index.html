<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>vCard QR Generator</title>
  <!-- This library draws the QR code onto the page. We're loading it from a CDN
       so you don't have to install anything with npm. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="QRCode.css" />
</head>
<body>

  <div class="card">
    <h1>Calling Card QR Generator</h1>
    <p class="subtitle">Fill in your details, then generate a scannable QR code.</p>

    <!-- Each input here maps to one line of the vCard text we'll build in script.js -->
    <form id="vcard-form">
      <label>Full Name
        <input type="text" id="Name" placeholder="Your Name" required />
      </label>

      <label>Phone
        <input type="tel" id="Phone" placeholder="+63 " />
      </label>

      <label>Email
        <input type="email" id="Email" placeholder="you@email.com" />
      </label>

      <label>Website
        <input type="text" id="Website" placeholder="www.company.com" />
      </label>

      <label>Company
        <input type="text" id="Company" placeholder="Company Name" />
      </label>

      <label>Title
        <input type="text" id="Title" placeholder="Job Title" />
      </label>

      <label>Address
        <input type="text" id="Address" placeholder="Address />
      </label>

      <button type="submit">Generate QR Code</button>
    </form>

    <!-- The QR library will inject the QR image inside this div -->
    <div id="qrcode"></div>

    <!-- Lets the user double check the raw vCard text being encoded -->
    <pre id="vcard-preview"></pre>
  </div>

  <script src="script.js"></script>
</body>
</html>
